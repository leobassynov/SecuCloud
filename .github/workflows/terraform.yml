# Workflow terraform pour déploiement Azure

name: Security Scan & Azure Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permissions requises
permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  validate_and_scan:
    name: Lint, Validate & Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # 1. Installer et initialiser Terraform en local pour la validation syntaxique
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0 

      - name: Terraform Init (Validation)
        run: |
          cd src
          terraform init -backend=false 

      - name: Terraform Validate
        run: |
          cd src
          terraform validate

      # 2. Scan de sécurité avec Checkov
      - name: Checkov Security Scan
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: src/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: false # arrêt en cas de faille 

      - name: Upload des résultats SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: results.sarif

  deploy_azure:
    name: Azure Login & Deploy
    runs-on: ubuntu-latest
    needs: validate_and_scan # Bloquage du déploiement si le scan échoue
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Ne déploie que sur un push sur main
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # 1. Connexion sécurisée à Azure via OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 2. Configuration de Terraform pour le vrai déploiement
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      # 3. Initialisation avec le vrai Backend Azure (pour stocker le tfstate)
      - name: Terraform Init
        run: |
          cd src
          terraform init \
            -backend-config="resource_group_name=rg-terraform-state" \
            -backend-config="storage_account_name=sttfstatebackend" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=prod.terraform.tfstate"

      # 4. Génération du plan d'exécution
      - name: Terraform Plan
        run: |
          cd src
          terraform plan -out=tfplan

      # 5. Application des modifications sur Azure
      - name: Terraform Apply
        run: |
          cd src
          terraform apply -auto-approve tfplan
